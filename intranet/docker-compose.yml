services:
  frontend:
    image: nginx:latest
    container_name: novacare_intranet_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend:/etc/nginx/templates:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: novacare_intranet_backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: novacare_intranet
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: novacare_intranet_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: novacare_intranet
    volumes:
      - intranet_mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  intranet_mysql_data:
