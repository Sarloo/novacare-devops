services:
  frontend:
    image: nginx:latest
    container_name: novacare_landing_frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: novacare_landing_backend
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: novacare
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: novacare_landing_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: novacare
    volumes:
      - landing_mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  landing_mysql_data:
